<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriBot - Smart Farming Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #2e7d32; }
        .navbar-brand, .nav-link { color: white !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">🌱 AgriBot</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'predict_crop' %}">Crop Recommendation</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'predict_fertilizer' %}">Fertilizer Recommendation</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'predict_disease' %}">Disease Detection</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'predict_yield' %}">Yield Prediction</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        {% block content %}
        {% endblock %}
    </div>

    <div style="display:none;">{% csrf_token %}</div>

    {% include 'chatbot.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
