<style>
    /* Floating Chatbot CSS */
    #chat-widget {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 380px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        display: none;
        flex-direction: column;
        overflow: hidden;
        z-index: 1000;
        border: 1px solid #e0e0e0;
    }
    #chat-header {
        background: #2e7d32;
        color: white;
        padding: 15px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    #chat-header button {
        background: none;
        border: none;
        color: white;
        font-size: 24px;
        cursor: pointer;
        line-height: 1;
    }
    #chat-messages {
        height: 350px;
        overflow-y: auto;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #f8f9fa;
    }
    .message {
        max-width: 85%;
        padding: 10px 15px;
        border-radius: 18px;
        font-size: 14px;
        line-height: 1.4;
    }
    .user-message { background: #2e7d32; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bot-message { background: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
    
    /* Input Area Styling */
    #chat-input-area { display: flex; padding: 10px; background: white; border-top: 1px solid #eee; align-items: center; gap: 5px;}
    #chat-lang { border-radius: 15px; border: 1px solid #ccc; padding: 5px; font-size: 12px; outline: none; background: #f8f9fa; cursor: pointer;}
    #chat-input { flex-grow: 1; border: 1px solid #ccc; border-radius: 20px; padding: 8px 12px; outline: none; font-size: 13px; width: 100%;}
    #chat-input:focus { border-color: #2e7d32; }
    
    #send-btn, #camera-btn, #mic-btn, #stop-audio-btn { background: none; border: none; font-size: 1.3em; cursor: pointer; padding: 0 2px;}
    #send-btn { color: #2e7d32; }
    #mic-btn { color: #2196F3; } /* Changed mic color to blue to stand out */
    #stop-audio-btn { color: #d32f2f; display: none; } /* Hidden by default */
    
    /* Image Preview Styling */
    #image-preview-container { display: none; padding: 10px; background: #f1f8e9; border-top: 1px solid #ddd; text-align: center; }
    #image-preview { max-height: 120px; border-radius: 8px; margin: 0 auto 10px auto; display: block; }
    .preview-btn { padding: 5px 15px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
    
    /* Toggle Button */
    #chat-toggle {
        position: fixed; bottom: 25px; right: 25px; background: #2e7d32; color: white; border: none;
        border-radius: 50%; width: 65px; height: 65px; font-size: 30px; cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 999; transition: 0.3s;
    }
    #chat-toggle:hover { transform: scale(1.05); }
</style>

<button id="chat-toggle" onclick="toggleChat()">💬</button>

<div id="chat-widget">
    <div id="chat-header">
        <span>🌱 AgriBot Assistant</span>
        <button onclick="toggleChat()">&times;</button>
    </div>
    
    <div id="chat-messages">
        <div class="message bot-message">Namaste! I am AgriBot. Ask me about crops, fertilizers, or <strong>upload a photo</strong> of a diseased plant!</div>
    </div>

    <div id="image-preview-container">
        <img id="image-preview" src="" alt="Selected Plant" />
        <button onclick="sendImage()" class="preview-btn" style="background: #4CAF50;">🔍 Analyze Disease</button>
        <button onclick="cancelImage()" class="preview-btn" style="background: #f44336;">Cancel</button>
    </div>

    <div id="chat-input-area">
        <select id="chat-lang" title="Select Language">
            <option value="en-IN">EN</option>
            <option value="kn-IN">ಕನ್ನಡ</option>
            <option value="hi-IN">हिंदी</option>
        </select>

        <button id="mic-btn" onclick="startDictation()" title="Click to Speak">🎤</button>
        <!-- NEW STOP AUDIO BUTTON -->
        <button id="stop-audio-btn" onclick="stopAudio()" title="Stop Voice">⏹️</button>
        
        <input type="file" id="image-upload" accept="image/*" style="display: none;" />
        <button id="camera-btn" onclick="document.getElementById('image-upload').click()" title="Upload Photo">📷</button>
        
        <input type="text" id="chat-input" placeholder="Type or speak..." onkeypress="handleEnter(event)">
        <button id="send-btn" onclick="sendTextMessage()">➤</button>
    </div>
</div>

<script>
    // --- 0. GLOBAL AUDIO CONTROLLER ---
    let currentAudio = null;

    function stopAudio() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0; // Reset audio to beginning
            currentAudio = null;
        }
        // Hide the stop button when pressed
        document.getElementById('stop-audio-btn').style.display = 'none';
    }

    // --- 1. UI Toggles ---
    function toggleChat() {
        const chatWidget = document.getElementById('chat-widget');
        const chatToggle = document.getElementById('chat-toggle');
        if (chatWidget.style.display === 'none' || chatWidget.style.display === '') {
            chatWidget.style.display = 'flex';
            chatToggle.style.display = 'none';
            document.getElementById('chat-input').focus();
        } else {
            chatWidget.style.display = 'none';
            chatToggle.style.display = 'block';
        }
    }

    // --- 2. CSRF Helper ---
    function getCSRFToken() {
        return document.querySelector('[name=csrfmiddlewaretoken]').value;
    }

    // --- 3. UI Helpers ---
    function addMessageToUI(text, className, id = null) {
        const messagesDiv = document.getElementById('chat-messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerHTML = text; 
        if (id) msgDiv.id = id;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return id || 'msg-' + Date.now();
    }

    // --- 4. TEXT MESSAGE LOGIC (NLP Master RAG Pipeline) ---
    function handleEnter(event) { if (event.key === 'Enter') sendTextMessage(); }

    async function sendTextMessage() {
        const inputField = document.getElementById('chat-input');
        const langSelect = document.getElementById('chat-lang').value;
        const message = inputField.value.trim();
        
        if (!message) return;

        addMessageToUI(message, 'user-message');
        inputField.value = '';

        const loadingId = 'loading-' + Date.now();
        addMessageToUI('...', 'bot-message', loadingId);

        try {
            const response = await fetch('/api/chat/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': getCSRFToken()
                },
                body: new URLSearchParams({ 'message': message, 'lang': langSelect })
            });

            const data = await response.json();
            document.getElementById(loadingId).remove();

            if (data.response) {
                let formattedText = data.response.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                
                // --- NEW UI FEATURE: DYNAMIC INPUT FIELDS FOR MISSING DATA ---
                if (data.missing_parameters && data.missing_parameters.length > 0) {
                    let formHtml = `<div style="margin-top: 12px; background: #e8f5e9; padding: 12px; border-radius: 8px; border: 1px solid #c8e6c9;">`;
                    
                    data.missing_parameters.forEach(param => {
                        let label = param.length === 1 ? param.toUpperCase() : param.charAt(0).toUpperCase() + param.slice(1);
                        formHtml += `
                            <div style="margin-bottom: 8px;">
                                <label style="font-size: 12px; font-weight: bold; color: #2e7d32;">${label}:</label>
                                <input type="number" step="any" id="missing-input-${param}" placeholder="Enter ${label}" 
                                       style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #a5d6a7; margin-top: 4px; box-sizing: border-box;">
                            </div>`;
                    });
                    
                    formHtml += `<button onclick="submitMissingParams(event, '${data.missing_parameters.join(',')}')" 
                                 style="background: #2e7d32; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 8px;">
                                 Submit Data
                                 </button>
                                 </div>`;
                    
                    formattedText += formHtml;
                }
                // -------------------------------------------------------------

                addMessageToUI(formattedText, 'bot-message');
                speakText(data.response); // It will only speak the text, not read the HTML form code!
            } else {
                addMessageToUI("Sorry, I encountered an error processing your query.", 'bot-message');
            }
        } catch (error) {
            document.getElementById(loadingId).remove();
            addMessageToUI("Error connecting to server. Is the backend running?", 'bot-message');
        }
    }

    // --- NEW UI HELPER: HANDLE IN-CHAT FORM SUBMISSION ---
    function submitMissingParams(event, paramsString) {
        const params = paramsString.split(',');
        let submissionString = "";
        let isComplete = true;

        // Collect all the values the user typed into the dynamic boxes
        params.forEach(param => {
            const inputVal = document.getElementById(`missing-input-${param}`).value;
            if (!inputVal) {
                isComplete = false;
            } else {
                submissionString += `${param}=${inputVal} `;
            }
        });

        if (!isComplete) {
            alert("Please fill in all requested fields to calculate the recommendation.");
            return;
        }

        // Disable the form button and inputs so they can't double-click it
        event.target.disabled = true;
        event.target.innerText = "Submitting...";
        params.forEach(param => document.getElementById(`missing-input-${param}`).disabled = true);

        // Secretly place the formatted string into the main chat input and click send!
        const chatInput = document.getElementById('chat-input');
        chatInput.value = submissionString.trim();
        sendTextMessage();
    }

    // --- 5. IMAGE MESSAGE LOGIC (ResNet Disease Detection) ---
    const imageUpload = document.getElementById('image-upload');
    const previewContainer = document.getElementById('image-preview-container');
    const imagePreview = document.getElementById('image-preview');

    imageUpload.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                previewContainer.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    function cancelImage() {
        imageUpload.value = ""; 
        previewContainer.style.display = 'none'; 
    }

    async function sendImage() {
        const file = imageUpload.files[0];
        if (!file) return;

        addMessageToUI(`<img src="${imagePreview.src}" style="max-width: 100%; border-radius: 8px;">`, 'user-message');
        cancelImage(); 

        const loadingId = addMessageToUI('🔍 Analyzing image...', 'bot-message', 'loading-' + Date.now());

        const formData = new FormData();
        formData.append('plant_image', file);

        try {
            const response = await fetch('/api/detect-disease/', {
                method: 'POST',
                headers: { 'X-CSRFToken': getCSRFToken() },
                body: formData,
            });

            const data = await response.json();
            document.getElementById(loadingId).remove();

            if (data.status === 'success') {
                const isError = data.disease === 'Unrecognized Image';
                const borderColor = isError ? '#ff9800' : '#4CAF50';
                
                const resultHtml = `
                    <div style="margin-bottom: 8px; background: white; padding: 5px; border-radius: 4px; border: 1px solid ${borderColor};">
                        <strong>${isError ? 'Alert:' : 'Diagnosis:'}</strong> ${data.disease} <br>
                        <small>Confidence: ${data.confidence}</small>
                    </div>
                    <div>${data.bot_response.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')}</div>
                `;
                addMessageToUI(resultHtml, 'bot-message');
                speakText(data.bot_response);
                
            } else {
                addMessageToUI(`❌ Error: ${data.message}`, 'bot-message');
            }
        } catch (error) {
            document.getElementById(loadingId).remove();
            addMessageToUI('❌ Failed to connect to the server.', 'bot-message');
        }
    }

    // --- 6. MULTILINGUAL MICROPHONE LOGIC ---
    function startDictation() {
        const micBtn = document.getElementById('mic-btn');
        const chatInput = document.getElementById('chat-input');
        const langSelect = document.getElementById('chat-lang');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = langSelect.value; 

            recognition.onstart = function() {
                micBtn.innerHTML = '🔴';
                chatInput.placeholder = "Listening...";
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                chatInput.value = transcript;
                micBtn.innerHTML = '🎤';
                chatInput.placeholder = "Type or speak...";
            };

            recognition.onerror = function(event) {
                console.error("Speech recognition error:", event.error);
                micBtn.innerHTML = '🎤';
                chatInput.placeholder = "Error hearing you. Try again.";
            };

            recognition.onspeechend = function() {
                recognition.stop();
                micBtn.innerHTML = '🎤';
                chatInput.placeholder = "Type or speak...";
            };

            recognition.start();
        } else {
            alert("Speech Recognition is not supported in this browser. Please use Chrome or Edge.");
        }
    }

    // --- 7. TEXT TO SPEECH (BACKEND CLOUD AUDIO) ---
    function speakText(text) {
        // 1. Stop any currently playing audio before starting a new one
        stopAudio();

        // 2. Heavy Regex Cleaning to remove non-spoken characters
        // First, remove HTML tags like <br> or <strong>
        let cleanText = text.replace(/<[^>]*>?/gm, ''); 
        
        // Remove Markdown formatting (asterisks, hashtags, dashes, underscores)
        cleanText = cleanText.replace(/[*#_\-`~]/g, ''); 
        
        // Remove specific punctuation that TTS reads out loud (commas, colons, brackets)
        // Note: Periods and question marks are kept so the bot pauses between sentences naturally.
        cleanText = cleanText.replace(/[,;:'"()[\]{}]/g, ' '); 
        
        // Remove double spaces left behind by deleted characters
        cleanText = cleanText.replace(/\s+/g, ' ').trim();
        
        // 3. Fetch Language and Execute
        const langSelect = document.getElementById('chat-lang').value;
        const url = `/api/speak/?text=${encodeURIComponent(cleanText)}&lang=${langSelect}`;
        
        currentAudio = new Audio(url);
        
        // Show the Stop button now that audio is loading
        const stopBtn = document.getElementById('stop-audio-btn');
        stopBtn.style.display = 'inline-block';
        
        currentAudio.play().catch(e => {
            console.error("Audio play failed:", e);
            stopBtn.style.display = 'none'; // Hide if auto-play is blocked
        });

        // Automatically hide the Stop button when the voice finishes speaking
        currentAudio.onended = function() {
            stopBtn.style.display = 'none';
            currentAudio = null;
        };
    }
</script>
